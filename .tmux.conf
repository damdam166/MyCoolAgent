# Status Bar.
set-option -g status-position top
set -g status-fg colour7
#set -g status-bg colour234
#set -g status-bg default
set -g status-bg black

# Current Session.
set -g status-left ' #S '
set -g status-left-length 15

# Highlight active window
set-window-option -g window-status-current-style "bg=#051094"
set -g pane-border-style fg=white
set -g pane-active-border-style fg="#3844BC"

# Window List.
set -g window-status-format "#[fg=colour8] #I #[fg=colour231]#W#[fg=colour166]#F "
set -g window-status-current-format "#[fg=colour117,bg=colour31] #I #[fg=colour231]#W#[fg=colour234]#F "
set -g window-status-separator ""

# Status right.
#set -g status-right "#[fg=#3944BC]%m-%d-%Y #[fg=white]~#[fg=#FFC000] %l:%M %p "
set -g status-right ""
set -g status-right-length 150

# Awkward moment when missclicked
unbind C-z
unbind space

# Change the master key.
# set -g prefix C-space
# unbind-key C-b
# bind-key C-space send-prefix

# Change the pane keys.
bind-key e split-window -h # horizontal pane
bind-key a split-window -v # vertical pane
bind-key x kill-pane

# Start numbering windows from 1 instead of zero.
set -g base-index 1

# Vim integration.
set -g editor vim
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Vim friendly settings.
set-option -sg escape-time 2
set-window-option -g mode-keys vi
setw -g mode-keys vi

bind-key C-h select-pane -L
bind-key C-j select-pane -D
bind-key C-k select-pane -U
bind-key C-l select-pane -R

# In a tty, it is not possible to resize the panes by default.
bind -r K resize-pane -U 1
bind -r J resize-pane -D 1
bind -r H resize-pane -L 1
bind -r L resize-pane -R 1

# Autocmd support for FocusLost/FocusGained
set -g focus-events on

# Copy mode.
set -g set-clipboard on
set -g mouse on

bind-key v copy-mode
bind -T copy-mode-vi Enter send -X copy-pipe
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# key to get a popup shell.
bind ! display-popup -w 80% -h 80% -E "tmux new-session -A -s scratch"

# Serve each page with ease.
set-option -g renumber-windows on
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 0

# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Keep while reboot
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @resurrect-strategy-vim 'session'
# set -g @resurrect-processes '"watch cpupower frequency-info" btop nyx iotop'

# fast Research
# set -g @plugin 'sainnhe/tmux-fzf'

# set -g @plugin 'tmux-plugins/tmux-yank'

run -b '~/.tmux/plugins/tpm/tpm'
